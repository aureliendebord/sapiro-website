<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Dynastie Han - Dragon impérial rouge sur fond jaune -->
  <rect width="900" height="600" fill="#FFD700"/>
  <rect x="15" y="15" width="870" height="570" fill="none" stroke="#C41E3A" stroke-width="10"/>
  <!-- Dragon chinois stylisé -->
  <g transform="translate(450, 300)" fill="#C41E3A">
    <!-- Corps serpentiforme du dragon -->
    <path d="M-200,50 Q-150,-50 -50,-30 Q50,-50 100,0 Q150,50 100,100 Q50,80 0,100 Q-100,120 -150,80 Q-200,40 -200,50" stroke="#C41E3A" stroke-width="30" fill="none"/>
    <!-- Tête du dragon -->
    <ellipse cx="150" cy="0" rx="80" ry="50"/>
    <!-- Yeux -->
    <circle cx="170" cy="-15" r="12" fill="#FFD700"/>
    <circle cx="170" cy="-15" r="6" fill="#000"/>
    <!-- Cornes -->
    <path d="M120,-40 Q100,-80 130,-100" stroke="#C41E3A" stroke-width="10" fill="none"/>
    <path d="M160,-40 Q180,-80 150,-100" stroke="#C41E3A" stroke-width="10" fill="none"/>
    <!-- Moustaches/Barbillons -->
    <path d="M220,0 Q280,-20 300,0" stroke="#C41E3A" stroke-width="6" fill="none"/>
    <path d="M220,20 Q280,40 300,20" stroke="#C41E3A" stroke-width="6" fill="none"/>
    <!-- Pattes griffues -->
    <g transform="translate(-100, 80)">
      <path d="M0,0 L-20,40 M0,0 L0,45 M0,0 L20,40" stroke="#C41E3A" stroke-width="8"/>
    </g>
    <g transform="translate(50, 100)">
      <path d="M0,0 L-20,35 M0,0 L0,40 M0,0 L20,35" stroke="#C41E3A" stroke-width="8"/>
    </g>
    <!-- Flammes/Perle -->
    <circle cx="-200" cy="50" r="30" fill="#C41E3A" stroke="#FFD700" stroke-width="4"/>
  </g>
</svg>