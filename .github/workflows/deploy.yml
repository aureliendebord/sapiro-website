name: Deploy to Cloudflare Pages

# Déploiement reproductible de la prod sapiro.app.
# Sur push vers main : build Astro (Node 20) puis `wrangler pages deploy`.
# Le déclencheur manuel permet de redéployer sans nouveau commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois ; on annule les runs en attente obsolètes.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Le cœur de jeu est commité (le repo de l'app est absent en CI) : on
      # vérifie qu'il tourne encore et qu'il pose toujours les MÊMES questions
      # que l'app — empreinte du Défi du jour figée par `npm run parity:game`.
      - run: npm run smoke:game
      - run: npm run check:parity

      # Déclenche aussi le hook `prebuild` (vérif des liens cross-langue).
      # Les PUBLIC_* sont inlinées dans le bundle du jeu au build : sans elles,
      # le jeu tourne mais sans compte ni abonnement (voir src/game/README.md).
      - run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_RC_WEB_API_KEY: ${{ secrets.PUBLIC_RC_WEB_API_KEY }}

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Version figée = déploiement reproductible (wrangler >= 4 exige Node 22).
          wranglerVersion: "4.104.0"
          # --branch=main = branche de prod du projet CF Pages -> déploiement
          # en production (sapiro.app), pas un preview *.pages.dev.
          command: pages deploy dist --project-name=sapiro --branch=main
