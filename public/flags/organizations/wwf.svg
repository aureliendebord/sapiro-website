<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60">
  <!-- WWF - World Wildlife Fund - Panda logo -->
  <rect width="120" height="60" fill="#FFFFFF"/>
  <!-- Simplified Panda face -->
  <ellipse cx="60" cy="28" rx="22" ry="20" fill="#000"/>
  <!-- White face -->
  <ellipse cx="60" cy="30" rx="16" ry="14" fill="#FFF"/>
  <!-- Left eye patch -->
  <ellipse cx="52" cy="26" rx="7" ry="8" fill="#000"/>
  <!-- Right eye patch -->
  <ellipse cx="68" cy="26" rx="7" ry="8" fill="#000"/>
  <!-- Left ear -->
  <circle cx="42" cy="14" r="8" fill="#000"/>
  <!-- Right ear -->
  <circle cx="78" cy="14" r="8" fill="#000"/>
  <!-- Nose -->
  <ellipse cx="60" cy="36" rx="4" ry="3" fill="#000"/>
  <!-- WWF text -->
  <text x="60" y="56" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">WWF</text>
</svg>
