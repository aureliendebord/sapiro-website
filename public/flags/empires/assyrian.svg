<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Empire assyrien - Étoile d'Ishtar stylisée sur fond pourpre royal -->
  <rect width="900" height="600" fill="#4A2040"/>
  <rect x="15" y="15" width="870" height="570" fill="none" stroke="#C9A227" stroke-width="10"/>
  <!-- Étoile d'Ishtar à 8 branches -->
  <g transform="translate(450, 300)">
    <!-- Rayons principaux (croix) -->
    <polygon points="0,-180 20,-40 0,-40 0,-180" fill="#C9A227"/>
    <polygon points="0,-180 -20,-40 0,-40 0,-180" fill="#C9A227"/>
    <polygon points="0,180 20,40 0,40 0,180" fill="#C9A227"/>
    <polygon points="0,180 -20,40 0,40 0,180" fill="#C9A227"/>
    <polygon points="-180,0 -40,20 -40,0 -180,0" fill="#C9A227"/>
    <polygon points="-180,0 -40,-20 -40,0 -180,0" fill="#C9A227"/>
    <polygon points="180,0 40,20 40,0 180,0" fill="#C9A227"/>
    <polygon points="180,0 40,-20 40,0 180,0" fill="#C9A227"/>
    <!-- Rayons diagonaux -->
    <polygon points="-127,-127 -28,-28 -42,-14 -127,-127" fill="#C9A227"/>
    <polygon points="-127,-127 -28,-28 -14,-42 -127,-127" fill="#C9A227"/>
    <polygon points="127,127 28,28 42,14 127,127" fill="#C9A227"/>
    <polygon points="127,127 28,28 14,42 127,127" fill="#C9A227"/>
    <polygon points="127,-127 28,-28 42,-14 127,-127" fill="#C9A227"/>
    <polygon points="127,-127 28,-28 14,-42 127,-127" fill="#C9A227"/>
    <polygon points="-127,127 -28,28 -42,14 -127,127" fill="#C9A227"/>
    <polygon points="-127,127 -28,28 -14,42 -127,127" fill="#C9A227"/>
    <!-- Cercle central -->
    <circle cx="0" cy="0" r="50" fill="#C9A227"/>
    <circle cx="0" cy="0" r="30" fill="#4A2040"/>
  </g>
</svg>