<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#fff"/>
  <!-- Atom symbol - the iconic IAEA emblem -->
  <g fill="none" stroke="#00589C" stroke-width="8">
    <!-- Three elliptical orbits -->
    <ellipse cx="256" cy="256" rx="140" ry="50" transform="rotate(0 256 256)"/>
    <ellipse cx="256" cy="256" rx="140" ry="50" transform="rotate(60 256 256)"/>
    <ellipse cx="256" cy="256" rx="140" ry="50" transform="rotate(120 256 256)"/>
  </g>
  <!-- Nucleus -->
  <circle cx="256" cy="256" r="25" fill="#00589C"/>
  <!-- Electrons on orbits -->
  <circle cx="396" cy="256" r="12" fill="#00589C"/>
  <circle cx="186" cy="135" r="12" fill="#00589C"/>
  <circle cx="186" cy="377" r="12" fill="#00589C"/>
  <!-- IAEA text below -->
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="#00589C" text-anchor="middle">IAEA</text>
  <!-- Olive branches simplified -->
  <g stroke="#4CAF50" stroke-width="3" fill="none">
    <path d="M100 480 Q130 450 160 470"/>
    <path d="M412 480 Q382 450 352 470"/>
  </g>
</svg>