<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Empire carthaginois - Symbole de Tanit sur fond rouge phénicien -->
  <rect width="900" height="600" fill="#C41E3A"/>
  <rect x="15" y="15" width="870" height="570" fill="none" stroke="#FFFFFF" stroke-width="8"/>
  <!-- Symbole de Tanit - déesse carthaginoise -->
  <g transform="translate(450, 300)" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3">
    <!-- Disque solaire (tête) -->
    <circle cx="0" cy="-120" r="50"/>
    <!-- Croissant de lune (bras) -->
    <path d="M-120,-50 Q-80,-100 0,-80 Q80,-100 120,-50 Q80,-60 0,-50 Q-80,-60 -120,-50" fill="#FFFFFF"/>
    <!-- Corps triangulaire (pyramide) -->
    <polygon points="0,-30 -100,150 100,150"/>
    <!-- Ligne horizontale (bras étendus) -->
    <line x1="-130" y1="-50" x2="130" y2="-50" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>