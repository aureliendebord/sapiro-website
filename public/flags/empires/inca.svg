<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- Empire Inca - Inspiré de la Wiphala et du soleil Inti -->

  <!-- Bandes arc-en-ciel (7 couleurs de la Wiphala) -->
  <rect y="0" width="900" height="86" fill="#E53935"/>
  <rect y="86" width="900" height="86" fill="#FB8C00"/>
  <rect y="172" width="900" height="85" fill="#FDD835"/>
  <rect y="257" width="900" height="86" fill="#43A047"/>
  <rect y="343" width="900" height="86" fill="#1E88E5"/>
  <rect y="429" width="900" height="85" fill="#3949AB"/>
  <rect y="514" width="900" height="86" fill="#8E24AA"/>

  <!-- Inti - Soleil Inca (au centre) -->
  <circle cx="450" cy="300" r="100" fill="#D4AF37"/>

  <!-- Rayons du soleil Inti (32 rayons alternés) -->
  <g fill="#D4AF37">
    <!-- Rayons droits -->
    <rect x="445" y="150" width="10" height="50"/>
    <rect x="445" y="400" width="10" height="50"/>
    <rect x="300" y="295" width="50" height="10"/>
    <rect x="550" y="295" width="50" height="10"/>

    <!-- Rayons diagonaux -->
    <polygon points="345,195 360,210 380,190 365,175"/>
    <polygon points="555,195 540,210 520,190 535,175"/>
    <polygon points="345,405 360,390 380,410 365,425"/>
    <polygon points="555,405 540,390 520,410 535,425"/>

    <!-- Rayons ondulés (style inca) -->
    <path d="M450 150 Q460 130 450 110 Q440 130 450 150"/>
    <path d="M450 450 Q460 470 450 490 Q440 470 450 450"/>
    <path d="M300 300 Q280 310 260 300 Q280 290 300 300"/>
    <path d="M600 300 Q620 310 640 300 Q620 290 600 300"/>

    <!-- Rayons supplémentaires -->
    <path d="M380 180 Q365 165 350 150" stroke="#D4AF37" stroke-width="8" fill="none"/>
    <path d="M520 180 Q535 165 550 150" stroke="#D4AF37" stroke-width="8" fill="none"/>
    <path d="M380 420 Q365 435 350 450" stroke="#D4AF37" stroke-width="8" fill="none"/>
    <path d="M520 420 Q535 435 550 450" stroke="#D4AF37" stroke-width="8" fill="none"/>
  </g>

  <!-- Visage d'Inti -->
  <circle cx="450" cy="300" r="70" fill="#FFA000"/>

  <!-- Yeux -->
  <circle cx="425" cy="285" r="12" fill="#1E1E1E"/>
  <circle cx="475" cy="285" r="12" fill="#1E1E1E"/>
  <circle cx="428" cy="282" r="4" fill="#FFFFFF"/>
  <circle cx="478" cy="282" r="4" fill="#FFFFFF"/>

  <!-- Nez -->
  <ellipse cx="450" cy="305" rx="8" ry="10" fill="#E65100"/>

  <!-- Bouche -->
  <path d="M430 330 Q450 345 470 330" stroke="#1E1E1E" stroke-width="4" fill="none"/>
</svg>
